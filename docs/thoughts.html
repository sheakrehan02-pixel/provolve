<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehan’s Thoughts</title>
<meta name="description" content="Rehan’s Thoughts. What I’m thinking about and working on. The newest idea always takes first place.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#161514;--mute:#77746e;--rule:#e3e0d8;--bg:#fbfaf7;--gold:#94700a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:19px/1.6 "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  font-variant-numeric:oldstyle-nums}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--gold)}
main{max-width:640px;margin:0 auto;padding:56px 24px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:88px}
header .name{font-size:19px;text-decoration:none}
header .name b{font-weight:600}
header nav{font-size:15px;color:var(--mute)}
header nav a{text-decoration:none;margin-left:18px}

.owner{font-size:15px;color:var(--mute);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:8px 0;margin:-60px 0 60px}
.owner button,.link{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.owner button:hover,.link:hover{color:var(--gold)}
.owner span+span::before{content:" · "}

.first{position:relative}
.rank{display:block;font-size:15px;letter-spacing:.08em;color:var(--gold);margin-bottom:10px;font-variant:small-caps;font-variant-numeric:lining-nums}
.rank::before{content:"";display:inline-block;width:28px;height:1px;background:var(--gold);vertical-align:middle;margin-right:10px}
@media (min-width:980px){
  .first .rank{position:absolute;left:-190px;top:4px;margin:0;width:160px;text-align:right;white-space:nowrap}
  .first .rank::before{display:none}
  .first .rank b{display:block;font-size:52px;line-height:.9;font-weight:400;letter-spacing:-.02em;font-variant:normal}
}
.rank b{font-weight:400}
h1{font-size:40px;line-height:1.12;font-weight:400;margin:0 0 12px;letter-spacing:-.01em}
.since{color:var(--mute);font-style:italic;font-size:16px;margin:0 0 34px}
.body p{margin:0 0 1.1em}
.body blockquote{margin:0 0 1.1em;padding-left:20px;border-left:1px solid var(--ink);font-style:italic}
.tools{font-size:15px;color:var(--mute);margin-top:6px}
.tools .link+.link{margin-left:14px}

.vacant h1{color:var(--mute)}

hr{border:0;border-top:1px solid var(--rule);margin:72px 0 28px}
h2{font-size:15px;font-weight:400;letter-spacing:.08em;font-variant:small-caps;color:var(--mute);margin:0 0 14px}
ol.past{list-style:none;margin:0;padding:0}
ol.past li{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid var(--rule)}
ol.past li a{text-decoration:none}
ol.past li a:hover{text-decoration:underline}
ol.past li span{color:var(--mute);font-size:15px;white-space:nowrap;padding-top:3px}

.back{font-size:15px;color:var(--mute);margin:0 0 40px;display:inline-block}

form.write label{display:block;font-size:15px;color:var(--mute);margin:0 0 4px}
form.write input,form.write textarea{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;color:inherit;font:inherit;padding:6px 0;outline:none;resize:none}
form.write input{font-size:40px;line-height:1.12;margin-bottom:30px}
form.write textarea{min-height:320px;line-height:1.6}
form.write input:focus,form.write textarea:focus{border-bottom-color:var(--ink)}
form.write .row{display:flex;gap:22px;align-items:baseline;margin-top:22px;font-size:16px;flex-wrap:wrap}
form.write .hint{color:var(--mute);font-size:14px;margin-left:auto}
.publish{all:unset;cursor:pointer;background:var(--ink);color:var(--bg);padding:7px 16px 8px;font-size:16px}
.publish:hover{background:var(--gold)}
.publish[disabled]{opacity:.4;cursor:default}
.note{font-size:15px;color:var(--mute);font-style:italic}

footer{max-width:640px;margin:0 auto;padding:60px 24px 50px;font-size:14px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .link{text-decoration:none}
</style>
</head>
<body>
<main>
  <header>
    <a class="name" href="thoughts.html"><b>Rehan’s Thoughts</b></a>
    <nav><a href="index.html">Provolve</a></nav>
  </header>
  <div class="owner" id="owner" hidden></div>
  <div id="view"><p class="note">Loading…</p></div>
</main>
<footer>
  <span>Ideas worth backing. The newest one always takes first place.</span>
  <span><button class="link" id="signin" type="button">Sign in</button></span>
</footer>

<script type="module">
/* ─────────────────────────────────────────────────────────────────────
   Firebase settings. Paste the config from:
   Firebase console → Project settings → Your apps → Web app → Config.
   See THOUGHTS-SETUP.md in the repo for the full steps.
   ───────────────────────────────────────────────────────────────────── */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  appId: ""
};

const V = "10.12.2";
const view = document.getElementById('view');
const ownerBar = document.getElementById('owner');
const signinBtn = document.getElementById('signin');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const long = d => d.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
const short = d => d.toLocaleDateString('en-US', {month:'short', year:'numeric'});
const days = (a, b) => Math.max(1, Math.round((b - a) / 864e5));

/* Plain text in, paragraphs out. Supports *italic*, **bold**, [text](url) and lines starting with "> ". */
function render(src){
  return String(src || '').trim().split(/\n\s*\n/).map(block => {
    const quote = /^>\s?/.test(block);
    const h = esc(block.replace(/^>\s?/gm, ''))
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|[\w./#-]+)\)/g, '<a href="$2">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
    return quote ? `<blockquote>${h}</blockquote>` : `<p>${h}</p>`;
  }).join('');
}

let thoughts = [];      // newest first: {id, title, body, at: Date}
let isOwner = false;
let fb = null;          // firebase handles, once loaded

/* ───────── views ───────── */
function show(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === 'write') return isOwner ? editor() : (location.hash = '');
  if (id.startsWith('edit/')) {
    const t = thoughts.find(x => x.id === id.slice(5));
    return isOwner && t ? editor(t) : (location.hash = '');
  }
  if (id) { const i = thoughts.findIndex(t => t.id === id); if (i >= 0) return single(i); }
  home();
  document.title = 'Rehan’s Thoughts';
}

function ownerTools(t){
  return isOwner ? `<div class="tools"><a class="link" href="#edit/${esc(t.id)}">Edit</a><button class="link" type="button" data-del="${esc(t.id)}">Delete</button></div>` : '';
}

function home(){
  if (!thoughts.length){
    view.innerHTML = `<section class="first vacant">
      <span class="rank"><b>No. 1</b></span>
      <h1>Vacant.</h1>
      <p class="since">Nothing here yet. The first idea gets first place.</p>
    </section>`;
    return;
  }
  const [top, ...rest] = thoughts;
  view.innerHTML = `<article class="first">
      <span class="rank"><b>No. 1</b></span>
      <h1>${esc(top.title)}</h1>
      <p class="since">In first place since ${long(top.at)}</p>
      <div class="body">${render(top.body)}</div>
      ${ownerTools(top)}
    </article>
    ${rest.length ? `<hr><h2>Former No. 1s</h2><ol class="past">${rest.map((t, k) =>
      `<li><a href="#${esc(t.id)}">${esc(t.title)}</a><span>${short(t.at)} · held ${days(t.at, thoughts[k].at)}d</span></li>`
    ).join('')}</ol>` : ''}`;
}

function single(i){
  const t = thoughts[i], next = thoughts[i - 1];
  const line = next
    ? `${long(t.at)}. Held first place for ${days(t.at, next.at)} day${days(t.at, next.at) === 1 ? '' : 's'}.`
    : `In first place since ${long(t.at)}`;
  view.innerHTML = `<a class="back" href="#">← All thoughts</a>
    <article class="first">
      <span class="rank"><b>${next ? 'Former No. 1' : 'No. 1'}</b></span>
      <h1>${esc(t.title)}</h1>
      <p class="since">${line}</p>
      <div class="body">${render(t.body)}</div>
      ${ownerTools(t)}
    </article>`;
  document.title = t.title + ' · Rehan’s Thoughts';
  scrollTo(0, 0);
}

function editor(t){
  view.innerHTML = `<a class="back" href="#">← Cancel</a>
    <form class="write" id="write">
      <label for="wt">${t ? 'Editing' : 'New thought. Publishing puts it in first place.'}</label>
      <input id="wt" name="title" placeholder="Title" maxlength="200" required value="${esc(t?.title)}">
      <textarea id="wb" name="body" placeholder="Write it out." required>${esc(t?.body)}</textarea>
      <div class="row">
        <button class="publish" type="submit">${t ? 'Save' : 'Publish'}</button>
        <a href="#" class="link">Cancel</a>
        <span class="hint">Blank line for a new paragraph. *italic* **bold** [link](url)</span>
      </div>
      <p class="note" id="werr"></p>
    </form>`;
  const ta = document.getElementById('wb');
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(320, ta.scrollHeight) + 'px'; };
  ta.addEventListener('input', grow); grow();
  document.getElementById(t ? 'wb' : 'wt').focus();
  document.getElementById('write').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector('.publish'), err = document.getElementById('werr');
    const title = f.elements.title.value.trim(), body = f.elements.body.value.trim();
    if (!title || !body) return;
    btn.disabled = true; err.textContent = '';
    try {
      const { addDoc, updateDoc, doc, collection, serverTimestamp } = fb.fs;
      if (t) await updateDoc(doc(fb.db, 'thoughts', t.id), { title, body, updatedAt: serverTimestamp() });
      else await addDoc(collection(fb.db, 'thoughts'), { title, body, createdAt: serverTimestamp() });
      await load();
      history.replaceState(null, '', location.pathname);
      show();
    } catch (x) {
      btn.disabled = false;
      err.textContent = 'Couldn’t save: ' + (x.code || x.message);
    }
  });
}

view.addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  if (!del || !isOwner) return;
  const t = thoughts.find(x => x.id === del.dataset.del);
  if (!t || !confirm(`Delete “${t.title}”? This can’t be undone.`)) return;
  try {
    await fb.fs.deleteDoc(fb.fs.doc(fb.db, 'thoughts', t.id));
    await load();
    history.replaceState(null, '', location.pathname);
    show();
  } catch (x) { alert('Couldn’t delete: ' + (x.code || x.message)); }
});
addEventListener('hashchange', show);

/* ───────── data + sign-in ───────── */
async function load(){
  const { collection, getDocs, query, orderBy } = fb.fs;
  const snap = await getDocs(query(collection(fb.db, 'thoughts'), orderBy('createdAt', 'desc')));
  thoughts = snap.docs.map(d => ({ id: d.id, ...d.data(), at: d.data().createdAt?.toDate?.() || new Date() }));
}

function paintOwner(user){
  if (!user){ ownerBar.hidden = true; signinBtn.textContent = 'Sign in'; return; }
  signinBtn.textContent = 'Sign out';
  ownerBar.hidden = false;
  ownerBar.innerHTML = isOwner
    ? `<span>Signed in as owner</span><span><a class="link" href="#write">Write a new thought</a></span><span><button type="button" id="so">Sign out</button></span>`
    : `<span>${esc(user.email)} isn’t an owner account.</span><span><button type="button" id="so">Sign out</button></span>`;
  ownerBar.querySelector('#so').onclick = () => fb.signOut(fb.auth);
}

async function start(){
  if (!firebaseConfig.projectId){
    show();
    signinBtn.onclick = () => alert('Sign-in isn’t set up yet. See THOUGHTS-SETUP.md in the repo.');
    return;
  }
  const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const auth = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const a = app.initializeApp(firebaseConfig);
  fb = { fs, db: fs.getFirestore(a), auth: auth.getAuth(a), signOut: auth.signOut };

  try { await load(); } catch (x) { console.error(x); }
  show();

  signinBtn.onclick = () => fb.auth.currentUser
    ? auth.signOut(fb.auth)
    : auth.signInWithPopup(fb.auth, new auth.GoogleAuthProvider())
        .catch(x => x.code !== 'auth/popup-closed-by-user' && alert('Sign-in failed: ' + x.code));

  auth.onAuthStateChanged(fb.auth, async user => {
    isOwner = false;
    if (user){
      // Only owner accounts are allowed to read owner/check (see firestore.rules),
      // so the owner emails never appear in this public page.
      try { await fs.getDoc(fs.doc(fb.db, 'owner', 'check')); isOwner = true; } catch { isOwner = false; }
    }
    paintOwner(user);
    show();
  });
}
start();
</script>
</body>
</html>
